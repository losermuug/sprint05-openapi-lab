openapi: 3.0.3
info:
  title: Corg ly Onboarding Training API
  version: 1.0.0
  description: UE-5 training mock. No production Corg.ly API is claimed. Photo and audio fixtures validate
    multipart transport only. Photos are not stored; bark meaning is deterministic; webhook deliveries
    are disabled. Bearer token corgly-lab-einstein-2026 is a public opaque demo token, not a JWT.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: SWPD laboratory
servers:
- url: /v1
  description: Same-origin training sandbox
security:
- BearerAuth: []
paths:
  /pets/upload-photo:
    post:
      operationId: upload_photo
      summary: Upload Einstein photo
      tags:
      - Onboarding
      description: Upload Einstein's included PNG to the training API; no production storage. Run npm
        start, install requirements.txt and execute this sample from any directory. Full setup and included
        fixtures are in README.md.
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoRequest'
            example: &id002
              pet_id: corgi_98231
              photo: einstein.png
      responses:
        '201':
          description: Verified mock response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
              example: &id001
                pet_id: corgi_98231
                pet_name: Einstein
                photo_id: photo_einstein_001
                filename: einstein.png
                content_type: image/png
                size_bytes: 92
                stored: false
                mode: mock
        '400':
          description: Invalid or missing inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid laboratory credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected service failure; documented, not fault-injected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File exceeds allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - lang: Python
        label: Complete executable Python
        source: "\"\"\"Upload Einstein's included PNG to the training API; no production storage.\"\"\"\
          \nimport json\nimport os\nfrom pathlib import Path\nimport requests\n\nbase_url = os.getenv('CORGLY_BASE_URL',\
          \ 'http://127.0.0.1:8085').rstrip('/')\nauth_token = os.getenv('CORGLY_TOKEN', 'corgly-lab-einstein-2026')\n\
          photo_path = Path(__file__).parent / 'assets' / 'einstein.png'\nwith photo_path.open('rb') as\
          \ photo_file:\n    photo_response = requests.post(\n        f'{base_url}/v1/pets/upload-photo',\n\
          \        headers={'Authorization': f'Bearer {auth_token}'},\n        data={'pet_id': 'corgi_98231'},\n\
          \        files={'photo': (photo_path.name, photo_file, 'image/png')},\n        timeout=10,\n\
          \    )\nphoto_response.raise_for_status()\nassert photo_response.status_code == 201\nprint(json.dumps(photo_response.json(),\
          \ indent=2))\n"
  /audio/translate-bark:
    post:
      operationId: translate_bark
      summary: Translate Einstein bark
      tags:
      - Onboarding
      description: Submit the included WAV fixture; the mock returns a fixed bark meaning. Run npm start,
        install requirements.txt and execute this sample from any directory. Full setup and included fixtures
        are in README.md.
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BarkRequest'
            example: &id004
              pet_id: corgi_98231
              audio: einstein_bark.wav
              language: en
      responses:
        '200':
          description: Verified mock response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarkResponse'
              example: &id003
                pet_id: corgi_98231
                translation_id: bark_einstein_001
                meaning: I want to play
                language: en
                confidence: 0.93
                mode: mock
                model: deterministic-lab-fixture
        '400':
          description: Invalid or missing inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid laboratory credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected service failure; documented, not fault-injected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File exceeds allowed size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - lang: Python
        label: Complete executable Python
        source: "\"\"\"Submit the included WAV fixture; the mock returns a fixed bark meaning.\"\"\"\n\
          import json\nimport os\nfrom pathlib import Path\nimport requests\n\nbase_url = os.getenv('CORGLY_BASE_URL',\
          \ 'http://127.0.0.1:8085').rstrip('/')\nauth_token = os.getenv('CORGLY_TOKEN', 'corgly-lab-einstein-2026')\n\
          audio_path = Path(__file__).parent / 'assets' / 'einstein_bark.wav'\nwith audio_path.open('rb')\
          \ as audio_file:\n    bark_response = requests.post(\n        f'{base_url}/v1/audio/translate-bark',\n\
          \        headers={'Authorization': f'Bearer {auth_token}'},\n        data={'pet_id': 'corgi_98231',\
          \ 'language': 'en'},\n        files={'audio': (audio_path.name, audio_file, 'audio/wav')},\n\
          \        timeout=10,\n    )\nbark_response.raise_for_status()\nassert bark_response.status_code\
          \ == 200\nprint(json.dumps(bark_response.json(), indent=2))\n"
  /webhooks/subscribe:
    post:
      operationId: subscribe_webhook
      summary: Subscribe to Einstein activity
      tags:
      - Onboarding
      description: Register the lab callback; the mock does not send webhook deliveries. Run npm start,
        install requirements.txt and execute this sample from any directory. Full setup and included fixtures
        are in README.md.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
            example: &id006
              pet_id: corgi_98231
              callback_url: https://swpd-sprint05-openapi-lab.ganzorigm04.chatgpt.site/callbacks/einstein
              events:
              - pet.photo.uploaded
              - bark.translated
      responses:
        '201':
          description: Verified mock response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
              example: &id005
                subscription_id: hook_einstein_001
                pet_id: corgi_98231
                callback_url: https://swpd-sprint05-openapi-lab.ganzorigm04.chatgpt.site/callbacks/einstein
                events:
                - pet.photo.uploaded
                - bark.translated
                status: active
                delivery_enabled: false
                mode: mock
        '400':
          description: Invalid or missing inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid laboratory credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected service failure; documented, not fault-injected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - lang: Python
        label: Complete executable Python
        source: "\"\"\"Register the lab callback; the mock does not send webhook deliveries.\"\"\"\nimport\
          \ json\nimport os\nimport requests\n\nbase_url = os.getenv('CORGLY_BASE_URL', 'http://127.0.0.1:8085').rstrip('/')\n\
          auth_token = os.getenv('CORGLY_TOKEN', 'corgly-lab-einstein-2026')\ncallback_url = os.getenv(\n\
          \    'CORGLY_CALLBACK_URL',\n    'https://swpd-sprint05-openapi-lab.ganzorigm04.chatgpt.site/callbacks/einstein',\n\
          )\nwebhook_payload = {\n    'pet_id': 'corgi_98231',\n    'callback_url': callback_url,\n  \
          \  'events': ['pet.photo.uploaded', 'bark.translated'],\n}\nwebhook_response = requests.post(\n\
          \    f'{base_url}/v1/webhooks/subscribe',\n    headers={'Authorization': f'Bearer {auth_token}'},\n\
          \    json=webhook_payload,\n    timeout=10,\n)\nwebhook_response.raise_for_status()\nassert\
          \ webhook_response.status_code == 201\nprint(json.dumps(webhook_response.json(), indent=2))\n"
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - status
      - errorType
      - error
      properties:
        status:
          type: string
          enum:
          - error
        errorType:
          type: string
        error:
          type: string
    PhotoResponse:
      type: object
      required:
      - pet_id
      - pet_name
      - photo_id
      - filename
      - content_type
      - size_bytes
      - stored
      - mode
      properties:
        pet_id:
          type: string
        pet_name:
          type: string
        photo_id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        stored:
          type: boolean
        mode:
          type: string
      additionalProperties: false
      example: *id001
    PhotoRequest:
      type: object
      required:
      - pet_id
      - photo
      properties:
        pet_id:
          type: string
          enum:
          - corgi_98231
          example: corgi_98231
        photo:
          type: string
          format: binary
          description: 'PNG or JPEG; 1 byte to 2 MiB. Included fixture: samples/assets/einstein.png.'
      example: *id002
    BarkResponse:
      type: object
      required:
      - pet_id
      - translation_id
      - meaning
      - language
      - confidence
      - mode
      - model
      properties:
        pet_id:
          type: string
        translation_id:
          type: string
        meaning:
          type: string
        language:
          type: string
        confidence:
          type: number
        mode:
          type: string
        model:
          type: string
      additionalProperties: false
      example: *id003
    BarkRequest:
      type: object
      required:
      - pet_id
      - audio
      - language
      properties:
        pet_id:
          type: string
          enum:
          - corgi_98231
          example: corgi_98231
        audio:
          type: string
          format: binary
          description: 'WAV; 1 byte to 2 MiB. Included fixture: a tone, not a real bark.'
        language:
          type: string
          enum:
          - en
          example: en
      example: *id004
    WebhookResponse:
      type: object
      required:
      - subscription_id
      - pet_id
      - callback_url
      - events
      - status
      - delivery_enabled
      - mode
      properties:
        subscription_id:
          type: string
        pet_id:
          type: string
        callback_url:
          type: string
        events:
          type: array
          items:
            type: string
        status:
          type: string
        delivery_enabled:
          type: boolean
        mode:
          type: string
      additionalProperties: false
      example: *id005
    WebhookRequest:
      type: object
      required:
      - pet_id
      - callback_url
      - events
      properties:
        pet_id:
          type: string
          enum:
          - corgi_98231
          example: corgi_98231
        callback_url:
          type: string
          format: uri
          pattern: ^https://
          example: https://swpd-sprint05-openapi-lab.ganzorigm04.chatgpt.site/callbacks/einstein
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - pet.photo.uploaded
            - bark.translated
      example: *id006
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Opaque public demo token: corgly-lab-einstein-2026. Not a production credential or
        JWT.'
tags:
- name: Onboarding
  description: Pet media and activity subscriptions.
